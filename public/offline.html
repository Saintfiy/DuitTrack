<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0B0F1A">
    <title>Offline - DuitTrack</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #09090b; color: #f4f4f5; }
      body { box-sizing: border-box; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
      main { max-width: 420px; }
      h1 { font-size: 1.5rem; }
      p { color: #a1a1aa; line-height: 1.6; }
      button { margin-top: 16px; border: 0; border-radius: 12px; padding: 12px 20px; background: #f4f4f5; color: #09090b; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Koneksi internet terputus</h1>
      <p>DuitTrack memerlukan koneksi internet untuk memuat akun dan data keuangan Anda. Sambungkan kembali ke internet, lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
